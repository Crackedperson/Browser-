name: Visit and Record Website

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Website URL to visit"
        required: true
        default: "https://example.com"
      duration:
        description: "Seconds to stay on the page"
        required: true
        default: "10"

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install playwright

      - name: Install real Chrome + Playwright deps
        run: npx playwright install --with-deps chrome

      - name: Visit site and record (real Chrome, virtual display)
        env:
          TARGET_URL: ${{ inputs.url }}
          DURATION_SECONDS: ${{ inputs.duration }}
        run: xvfb-run -a node record.js

      - name: Upload recording as artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-recording
          path: videos/*.webm
          if-no-files-found: error
