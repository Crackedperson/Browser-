name: Visit and Record Website

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Website URL to visit"
        required: true
        default: "https://example.com"
      duration:
        description: "Seconds to stay on the page"
        required: true
        default: "10"
      phone:
        description: "10-digit phone number"
        required: true
        default: ""
      # REMOVED: proxy input (now using secret)

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache session
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            auth.json
          key: ${{ runner.os }}-session-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-session-

      - name: Install dependencies
        run: |
          npm init -y
          npm install playwright

      - name: Install Playwright ffmpeg
        run: npx playwright install ffmpeg

      - name: Install Brave and xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb curl gnupg
          curl -fsSL https://brave-browser-apt-release.s3.brave.com/brave-core.asc | sudo gpg --dearmor -o /usr/share/keyrings/brave-browser-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg arch=amd64] https://brave-browser-apt-release.s3.brave.com/ stable main" | sudo tee /etc/apt/sources.list.d/brave-browser-release.list
          sudo apt-get update
          sudo apt-get install -y brave-browser

      - name: Find Brave
        run: |
          BRAVE=$(which brave-browser || echo "/usr/bin/brave-browser")
          echo "BRAVE_PATH=$BRAVE" >> $GITHUB_ENV

      - name: Start FlareSolverr
        continue-on-error: true
        run: |
          docker run -d --name=flaresolverr -p 8191:8191 \
            -e LOG_LEVEL=info \
            ghcr.io/flaresolverr/flaresolverr:latest
          sleep 15

      - name: Visit site and record
        env:
          TARGET_URL: ${{ inputs.url }}
          DURATION_SECONDS: ${{ inputs.duration }}
          BRAVE_PATH: ${{ env.BRAVE_PATH }}
          PHONE_NUMBER: ${{ inputs.phone }}
          # Read proxy from SECRET instead of input
          PROXY_SERVER: ${{ secrets.WEBSHARE_PROXY }}
          FLARESOLVERR_URL: http://localhost:8191/v1
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" node record.js

      - name: Save session
        uses: actions/upload-artifact@v4
        with:
          name: browser-session
          path: auth.json
          if-no-files-found: ignore

      - name: Upload all artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recording-${{ github.run_id }}
          path: |
            videos/
            screenshots/
            artifacts/
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: docker stop flaresolverr 2>/dev/null || true
